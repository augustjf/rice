# Place in ~/.config/alacritty/

[window]
dimensions = { columns = 150, lines = 50 }
opacity = 1.0

[terminal]
shell = { program = "/usr/bin/zsh" }

[font]
size = 10.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[general] 
import = ["~/.config/alacritty/themes/themes/everforest_dark_hard.toml"] 
live_config_reload = true
